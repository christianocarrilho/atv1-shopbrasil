# Autor: Christiano Henrique Carrilho Lopes da Silva
# Código de pessoa: 1691353
# Matrícula: 262987
# Ambiente Docker da ShopBrasil: PostgreSQL 18.7, inicialização do banco (db-init) e Airflow 3.4.0
# com LocalExecutor, Connection shopbrasil_postgres e pool ecommerce_pool de dois slots.
# O LocalExecutor dispensa Redis e workers Celery, suficientes para um DAG diário em uma máquina.
# A Web/API (#9) é um serviço próprio (web) que depende do db-init e usa apenas a conta de leitura.
# O Airflow não depende dela; `docker compose up -d` sobe os dois módulos.

x-airflow-common: &airflow-common
  image: apache/airflow:3.4.0-python3.12
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${AIRFLOW_DB_USER:?defina AIRFLOW_DB_USER no .env}:${AIRFLOW_DB_PASSWORD:?defina AIRFLOW_DB_PASSWORD no .env}@${SHOPBRASIL_DB_HOST:?defina SHOPBRASIL_DB_HOST no .env}:${SHOPBRASIL_DB_PORT:?defina SHOPBRASIL_DB_PORT no .env}/${AIRFLOW_DB_NAME:?defina AIRFLOW_DB_NAME no .env}
    # Todos os processos do Airflow 3 precisam do mesmo segredo para validar os tokens da Execution API.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?defina AIRFLOW_JWT_SECRET no .env}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Connection analítica do pipeline, lida pelo PostgresHook. A conta é a de escrita.
    AIRFLOW_CONN_SHOPBRASIL_POSTGRES: >-
      {"conn_type": "postgres",
      "host": "${SHOPBRASIL_DB_HOST:?defina SHOPBRASIL_DB_HOST no .env}",
      "port": ${SHOPBRASIL_DB_PORT:?defina SHOPBRASIL_DB_PORT no .env},
      "schema": "${SHOPBRASIL_DB_NAME:?defina SHOPBRASIL_DB_NAME no .env}",
      "login": "${SHOPBRASIL_DB_WRITER_USER:?defina SHOPBRASIL_DB_WRITER_USER no .env}",
      "password": "${SHOPBRASIL_DB_WRITER_PASSWORD:?defina SHOPBRASIL_DB_WRITER_PASSWORD no .env}"}
    FAKESTORE_BASE_URL: ${FAKESTORE_BASE_URL:-https://fakestoreapi.com}
    # Torna o pacote shopbrasil_pipeline importável pelos DAGs.
    PYTHONPATH: /opt/airflow/pipeline
  volumes:
    - ./pipeline/dags:/opt/airflow/dags:ro
    - ./pipeline/shopbrasil_pipeline:/opt/airflow/pipeline/shopbrasil_pipeline:ro
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    db-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: postgres
    # Na imagem 18, PGDATA fica em /var/lib/postgresql/18/docker; o volume cobre o diretório pai.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Execução única: contas, bancos, privilégios e db/schema.sql. Reaplique com `docker compose run --rm db-init`.
  db-init:
    image: postgres:18.7
    entrypoint: ["sh", "/db/aplicar.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SHOPBRASIL_DB_HOST: ${SHOPBRASIL_DB_HOST}
      SHOPBRASIL_DB_PORT: ${SHOPBRASIL_DB_PORT}
      SHOPBRASIL_DB_NAME: ${SHOPBRASIL_DB_NAME}
      SHOPBRASIL_DB_WRITER_USER: ${SHOPBRASIL_DB_WRITER_USER}
      SHOPBRASIL_DB_WRITER_PASSWORD: ${SHOPBRASIL_DB_WRITER_PASSWORD}
      SHOPBRASIL_DB_READER_USER: ${SHOPBRASIL_DB_READER_USER:?defina SHOPBRASIL_DB_READER_USER no .env}
      SHOPBRASIL_DB_READER_PASSWORD: ${SHOPBRASIL_DB_READER_PASSWORD:?defina SHOPBRASIL_DB_READER_PASSWORD no .env}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - ./db:/db:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Execução única: migra os metadados, cria o usuário da interface e define o pool.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        /entrypoint airflow version
        airflow pools set ecommerce_pool 2 "Limita a duas as tasks mapeadas de cálculo por categoria"
        airflow pools get ecommerce_pool
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?defina AIRFLOW_ADMIN_PASSWORD no .env}
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Web/API (#9): só a conta de leitura entra no contêiner; a de escrita fica no Airflow.
  web:
    build:
      context: ./web
    image: shopbrasil-web:local
    environment:
      SHOPBRASIL_DB_HOST: ${SHOPBRASIL_DB_HOST:?defina SHOPBRASIL_DB_HOST no .env}
      SHOPBRASIL_DB_PORT: ${SHOPBRASIL_DB_PORT:?defina SHOPBRASIL_DB_PORT no .env}
      SHOPBRASIL_DB_NAME: ${SHOPBRASIL_DB_NAME:?defina SHOPBRASIL_DB_NAME no .env}
      SHOPBRASIL_DB_READER_USER: ${SHOPBRASIL_DB_READER_USER:?defina SHOPBRASIL_DB_READER_USER no .env}
      SHOPBRASIL_DB_READER_PASSWORD: ${SHOPBRASIL_DB_READER_PASSWORD:?defina SHOPBRASIL_DB_READER_PASSWORD no .env}
    ports:
      - "127.0.0.1:${SHOPBRASIL_WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  airflow-logs:
