# Matrícula: 262987
# Executa o lint de arquitetura (#26), seus testes e os testes unitários do pipeline e das
# consultas da web (só biblioteca padrão) em cada PR e push na main. Os testes da web que
# precisam de FastAPI e psycopg são pulados aqui e rodam no contêiner da web.
# Usa um Python próprio do CI porque o lint depende só da biblioteca padrão e
# não deve acoplar às versões de runtime definidas na #1.
name: Arquitetura

on:
  pull_request:
  push:
    branches: [main, integracao-backlog]

permissions:
  contents: read

jobs:
  lint-arquitetura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes do lint
        run: python -m unittest discover -s qualidade/tests -v
      - name: Lint de arquitetura
        run: python qualidade/lint_arquitetura.py --listar
      - name: Testes unitários do pipeline
        run: python -m unittest discover -s pipeline/tests -t pipeline -v
      - name: Testes unitários da web (consultas)
        run: python -m unittest discover -s web/tests -t web -v
